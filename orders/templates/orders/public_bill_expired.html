<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Expired</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a;
    color: #e8e2d8;
    font-family: -apple-system, 'Segoe UI', Inter, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
  }
  .card { max-width: 360px; }
  .card .icon { font-size: 2rem; color: #c5a059; margin-bottom: 1rem; }
  .card h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: .5rem; }
  .card p { font-size: .85rem; color: #8a8278; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9679;</div>
    <h1>This bill link has expired</h1>
    <p>Bill links are valid for 7 days. Please contact the restaurant directly for a copy of your receipt.</p>
  </div>
</body>
</html>
