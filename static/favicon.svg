<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" fill="#0a0a0a" rx="6"/>
  <!-- Gold diamond (rotated square) -->
  <rect x="8" y="8" width="16" height="16" transform="rotate(45 16 16)" fill="#c5a059"/>
  <!-- Inner dark diamond for depth -->
  <rect x="11" y="11" width="10" height="10" transform="rotate(45 16 16)" fill="#0a0a0a"/>
  <!-- Tiny gold centre dot -->
  <circle cx="16" cy="16" r="2.5" fill="#c5a059"/>
</svg>
