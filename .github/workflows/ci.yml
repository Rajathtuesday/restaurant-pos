name: Rasova CI/CD

on:
  push:
    branches: [ main, qsr ]
  pull_request:
    branches: [ main ]

# Default GITHUB_TOKEN permissions are broad (effectively read/write on
# most of the repo) unless a workflow says otherwise. This workflow only
# checks out code and runs tests -- it never pushes, comments, or opens
# anything -- so read-only contents access is all it actually needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same major as production (Postgres 18.6 on Ubuntu 26.04) and the
        # box (postgres:18-bookworm). Was 16 until 3 Nov 2026.
        image: postgres:18
        env:
          POSTGRES_DB:       rasova_test
          POSTGRES_USER:     rasova
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # Unused or undefined names, unused variables and syntax errors fail the
      # build (ruff.toml), so dead code can't pile up again.
      - name: Lint
        run: ruff check .

      - name: Run Django system check
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          FIELD_ENCRYPTION_KEY: K_XCqmy_iTNLU_imyLyNX0_CVDTlGSQR-kgTQK1ZOno=
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          FIELD_ENCRYPTION_KEY: K_XCqmy_iTNLU_imyLyNX0_CVDTlGSQR-kgTQK1ZOno=
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py migrate --run-syncdb

      - name: Collect static files
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          FIELD_ENCRYPTION_KEY: K_XCqmy_iTNLU_imyLyNX0_CVDTlGSQR-kgTQK1ZOno=
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py collectstatic --noinput

      # The box's real backup and restore tests run pg_dump, pg_restore and
      # psql, which must be the same major version as the database, as on a
      # box (box/docker/Dockerfile installs postgresql-client-18 next to
      # postgres:18). The runner image brings its own, newer, tools: on
      # 2 Nov 2026 its pg_dump wrote "SET transaction_timeout", which the
      # Postgres 16 service doesn't know, the restore test failed and the
      # deploy was skipped. So ask the service which major it runs, install
      # that client, and put it first on PATH for the steps below. Changing
      # the service image above is then enough; the tools follow.
      # ubuntu-latest became Ubuntu 26.04 in late Oct 2026, whose own
      # repository has only Postgres 18. When the needed client isn't there,
      # add the PostgreSQL project's apt repository (apt.postgresql.org),
      # which carries every supported version for every Ubuntu release.
      - name: Postgres tools matching the database
        env:
          PGPASSWORD: testpass
        run: |
          major=$(psql -h 127.0.0.1 -U rasova -d rasova_test -tAc "SHOW server_version_num" | cut -c1-2)
          echo "Postgres service: major $major"
          sudo apt-get update -qq
          if ! apt-cache show "postgresql-client-$major" > /dev/null 2>&1; then
            echo "postgresql-client-$major is not in this Ubuntu's repository; adding apt.postgresql.org"
            sudo apt-get install -y -qq postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y -qq "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/$major/bin/pg_dump" --version

      - name: Run test suite
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          FIELD_ENCRYPTION_KEY: K_XCqmy_iTNLU_imyLyNX0_CVDTlGSQR-kgTQK1ZOno=
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: |
          # Every first-party app with test coverage. This used to list only
          # 7 apps (accounts orders tenants inventory menu setup
          # notifications) and was never updated when the orders-app-split
          # carved 7 new satellite apps out of orders (promos, printing,
          # tokens, kitchen, waiter, tablemerge, payments) -- meaning CI had
          # been silently not testing any of them (plus crm, finance,
          # reports, shifts, agency, portal, core, which were never in the
          # list either), while still gating the auto-deploy job below.
          #
          # --keepdb: with all 22 apps running together for the first time,
          # the run itself passed clean but the job still failed -- Django's
          # final DROP DATABASE at teardown hit "database is being accessed
          # by other users" (2 lingering sessions), unrelated to any test.
          # The Postgres service container is thrown away at the end of
          # every CI run regardless, so skipping that drop costs nothing and
          # sidesteps the race entirely.
          # agent: the print agent's own tests (agent/), never run in CI
          # while they sat at the repository root. portal was removed.
          # offers: added 19 Oct 2026; its tests (the engine, offers on
          # bills, offers.js in Node) had never run here since the app
          # arrived on 4 Oct.
          # covers (cover charges) and devtools (the demo pub seed): added
          # 20 Oct 2026, the day each got tests. box (the offline box
          # edition): added 20 Oct 2026 too; its real backup and restore
          # tests skip where pg_dump/psql don't match the server (the step
          # above installs matching ones, so here they run).
          python manage.py test \
            accounts agency agent billing box core covers crm devtools finance inventory \
            kitchen menu notifications offers orders payments \
            printing promos reports setup shifts \
            tablemerge tenants tokens waiter \
            --verbosity=1 --keepdb

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/qsr' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_KEY }}
          port:        22
          timeout:         120s     # SSH connection establish timeout
          command_timeout: 20m      # full deploy.sh runs long on t3.micro (collectstatic etc.)
          script: |
            # Let the server's fetch read the repository with this run's own
            # token: read-only (permissions above) and revoked when the job
            # ends, so no long-lived token stays in the server's .git/config.
            # GitHub wants the token as the password: a token alone in the URL
            # is a username with no password, which only worked while the
            # repository was public (the 3 Oct deploy failed on exactly that).
            cd /home/ubuntu/rasova
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/Rajathtuesday/restaurant-pos.git
            # Run the deploy script — setsid handles celery detachment
            bash /home/ubuntu/rasova/deploy.sh
