name: Rasova CI/CD

on:
  push:
    branches: [ main, qsr ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB:       rasova_test
          POSTGRES_USER:     rasova
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system check
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py migrate --run-syncdb

      - name: Collect static files
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: python manage.py collectstatic --noinput

      - name: Run test suite
        env:
          SECRET_KEY:    ci-test-secret-key-not-real-replace-in-prod
          DEBUG:         "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_ENGINE:     django.db.backends.postgresql
          DB_NAME:       rasova_test
          DB_USER:       rasova
          DB_PASSWORD:   testpass
          DB_HOST:       127.0.0.1
          DB_PORT:       "5432"
          REDIS_URL:     redis://127.0.0.1:6379/0
        run: |
          python manage.py test \
            accounts orders tenants inventory \
            menu setup notifications \
            --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/qsr' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_KEY }}
          port:        22
          timeout:     120s
          script: |
            cd /home/ubuntu/rasova
            git fetch origin qsr
            git reset --hard origin/qsr
            source .venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate
            python manage.py collectstatic --noinput
            # Restart gunicorn
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 2
            gunicorn \
              --bind 127.0.0.1:8000 \
              --workers 2 \
              --timeout 120 \
              --daemon \
              core.wsgi:application
            # Restart Celery worker (print queue, background tasks)
            pkill -f 'celery worker' 2>/dev/null || true
            sleep 1
            celery -A core worker \
              --queues=default,printing \
              --concurrency=2 \
              --loglevel=warning \
              --detach \
              --pidfile=/tmp/celery.pid \
              --logfile=/home/ubuntu/rasova/logs/celery.log
            sleep 2
            echo "Deploy complete — $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/)"
