name: Test and Deploy Rasova

# FIXES IN THIS FILE
# ==================
# Fix 1 — Node.js 20 deprecation warning
#   actions/checkout@v4 and actions/setup-python@v5 were running on Node 20.
#   Added FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true at the workflow env level
#   so all actions opt into Node 24 now, before it becomes forced on June 2 2026.
#
# Fix 2 — Deploy job always skipped (0s run time)
#   The if: condition checked refs/heads/main but the workflow only triggers
#   on the good-ui branch, so the condition could never be true.
#   Changed to refs/heads/good-ui to match the trigger.

on:
  push:
    branches: [ good-ui ]
  pull_request:
    branches: [ good-ui ]

# Fix 1: opt into Node 24 now for all actions in this workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================
  # JOB 1: Run the Tests
  # ============================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rasova_test
          POSTGRES_USER: rasova_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

    env:
      DEBUG: True
      SECRET_KEY: 5h^7agr$co1d!hha96blyp6k632_c6i5q52)i(y8n#fm9hjxj^
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: rasova_test
      DB_USER: rasova_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: http://localhost

    steps:
      - name: Download your code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Set up test database
        run: python manage.py migrate --noinput

      - name: Run all tests
        run: |
          python manage.py test accounts orders tenants \
            inventory reports crm shifts \
            --verbosity=2 --failfast

  # ============================
  # JOB 2: Deploy
  # (Only runs if Job 1 passed)
  # ============================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    # Fix 2: was refs/heads/main — workflow only triggers on good-ui so
    # this condition was never true and deploy always showed 0s / skipped
    if: github.ref == 'refs/heads/good-ui' && github.event_name == 'push'

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: /home/rasova/deploy.sh
