{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Serving | {{ outlet.name }}</title>
<link rel="stylesheet" href="{% static 'css/tokens/display_board.css' %}">
</head>
<body>

<div class="board-header">
    <div class="board-title">Now Serving</div>
    <div class="board-sub">{{ outlet.name }}</div>
</div>

<div class="token-grid" id="tokenGrid" aria-live="polite" data-stream="{% url 'display-stream' outlet.display_token %}" data-data="{% url 'display-data' outlet.display_token %}"></div>
<div class="empty-state" id="emptyState" hidden>Waiting for orders to be ready…</div>

<script type="module" src="{% static 'js/tokens/display_board.js' %}"></script>

</body>
</html>
