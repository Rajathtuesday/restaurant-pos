plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rasova.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.rasova.pos"
        minSdk 26          // Android 8.0+: covers 95%+ of active devices
        targetSdk 34
        versionCode 7
        versionName "1.3.1"   // 1.3.1: a page's file button opens the phone's picker (JsDialogs.onShowFileChooser); 1.3.0: a Rasova box (plain http on the local network, kept on the Wi-Fi when it has no internet; the print service stops when the phone is pointed elsewhere); 1.2.1: tells the server its real version (AppUserAgent), so the server can ask an old app to update; 1.2.0: pages' alert/confirm/prompt shown (JsDialogs), release key; 1.1.1: internet server addresses always https (ServerUrl); 1.1.0: agent key in the X-Agent-Key header

        // Empty by default: release builds get the URL from SharedPreferences
        // (user types it or scans a QR on first launch).
        buildConfigField "String", "SERVER_URL", '""'
    }

    buildFeatures {
        buildConfig true
    }

    // The release key lives outside the repository, in the signing machine's
    // home folder (~/.rasova_android/signing.properties next to
    // rasova-release.jks, made 19 Oct 2026). Where that file is missing, the
    // release build is simply left unsigned, so nothing secret is ever needed
    // to build. Every Rasova release must be signed with this same key, or
    // Android refuses it as an update.
    def signingFile = new File(System.getProperty("user.home"), ".rasova_android/signing.properties")
    def signing = new Properties()
    if (signingFile.exists()) {
        signingFile.withInputStream { signing.load(it) }
    }

    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Blank: like release. First launch shows the setup screen so each
            // restaurant scans its own QR (encodes https://<slug>.rasova.net) or
            // types its subdomain. Hardcoding rasova.net here short-circuited the
            // setup flow and dumped every device on the marketing landing page.
            buildConfigField "String", "SERVER_URL", '""'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // OkHttp: makes HTTP requests (poll for jobs, mark done/failed)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Coroutines: lets us write the polling loop without freezing the app
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    // ZXing: QR code scanner used on first-launch setup screen
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
}
