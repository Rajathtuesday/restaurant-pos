<script>
  // On a narrow screen the tab row scrolls sideways (see luxury.css), so bring the current report's tab into view.
  (function (strip) {
    var active = strip && strip.querySelector(".report-tab.active");
    if (!active || strip.scrollWidth <= strip.clientWidth) return;
    var offset = active.getBoundingClientRect().left - strip.getBoundingClientRect().left + strip.scrollLeft;
    strip.scrollLeft = offset - (strip.clientWidth - active.offsetWidth) / 2;
  })(document.currentScript && document.currentScript.parentElement);
</script>
