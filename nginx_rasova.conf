# Rasova nginx config — saves to /etc/nginx/sites-available/rasova on server
# Static files served by WhiteNoise through gunicorn (simpler, always works)

server {
    listen 80;
    server_name rasova.net www.rasova.net 18.60.238.104;

    # Larger uploads for menu photos and logos
    client_max_body_size 20M;

    # Landing page served directly by nginx — no Django involved
    # alias (not root) required here so nginx resolves the file correctly
    location = / {
        alias /home/ubuntu/rasova/core/templates/core/;
        try_files landing.html =404;
        add_header Content-Type "text/html; charset=utf-8";
        add_header Cache-Control "public, max-age=300";
    }

    # Pass everything else to gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
