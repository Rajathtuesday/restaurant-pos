# Rasova nginx config — saves to /etc/nginx/sites-available/rasova on server
# Static files served by WhiteNoise through gunicorn (simpler, always works)

server {
    listen 80;
    server_name rasova.net www.rasova.net 16.112.130.91;

    # Larger uploads for menu photos and logos
    client_max_body_size 20M;

    # Pass ALL requests to gunicorn — WhiteNoise serves static files fast
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
