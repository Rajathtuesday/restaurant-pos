<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Needs a Refresh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fafafa;
            --text-main: #111111;
            --text-muted: #737373;
            --accent-gold: #c5a059;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0a0a0a;
                --text-main: #f5f5f5;
                --text-muted: #888888;
                --accent-gold: #d4af37;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .error-container {
            text-align: center;
            padding: 3rem;
            max-width: 600px;
        }
        .error-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .error-title {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: normal;
        }
        .error-message {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn-luxury {
            border: 1px solid var(--accent-gold);
            background: transparent;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.9rem 2.4rem;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-luxury:hover {
            background: var(--accent-gold);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔄</div>
        <h1 class="error-title">Your Session Needs a Refresh</h1>
        <p class="error-message">
            This usually just means the page has been open for a while.
            Reloading will fix it, and nothing you were doing will be lost —
            just try the action again once the page comes back.
        </p>
        <button class="btn-luxury" onclick="window.location.reload()">Reload Page</button>
    </div>
</body>
</html>
