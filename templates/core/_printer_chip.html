{% comment %}
The printer chip: whether printing works, and what to do when it does not.
Filled from the 8-second notifications answer by static/js/core/app.js
(printing_status.js has the words). Hidden until the first answer.
{% endcomment %}
<button type="button" class="printer-chip" id="printer-chip" data-action="printer.explain" data-fit="Printer" data-fit-rank="7" hidden>
    <i class="bi bi-printer" aria-hidden="true"></i><span class="printer-chip-text fit-word"></span>
</button>
